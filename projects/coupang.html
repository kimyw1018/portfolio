<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쿠팡 WING 쿠폰 자동 갱신 스케줄러 · 프로젝트 상세 | 김예원 (코코)</title>
  <meta name="description" content="Coupang WING Open API 기반 즉시할인 쿠폰 자동 롤오버 스케줄러 — 전체 리포트">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400;1,9..144,500;1,9..144,600&display=swap" rel="stylesheet">

<body class="antialiased pb-16 bg-[var(--ed-paper)]">

    <div class="max-w-3xl mx-auto px-5 sm:px-8 h-16 flex items-center justify-between">
      <a href="../index.html#projects" class="ed-btn !py-2 !px-3.5 !text-[11px]">

        <span>메인으로 돌아가기</span>
      </a>
      <div class="flex items-center gap-2">
        <button id="theme-toggle" aria-label="테마 전환" class="ed-icon-btn">
          <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
          <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
        </button>
        <a href="https://github.com/kimyw1018/coupang-wing-coupon-manager" target="_blank" rel="noopener noreferrer" class="ed-icon-btn">
          <svg class="w-4 h-4 fill-current shrink-0" viewBox="0 0 24 24" aria-hidden="true">
            <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"/>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-5 sm:px-8 py-10 sm:py-14 space-y-12">

    <section class="space-y-5 pb-10 ed-rule-b" id="hero"></section>

    <div id="report-root" class="space-y-12"></div>

    <div class="pt-8 ed-rule flex items-center justify-between">
      <a href="../index.html#projects" class="ed-btn !py-2.5 !px-4">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>전체 프로젝트 목록으로</span>
      </a>
      <a href="https://github.com/kimyw1018/coupang-wing-coupon-manager" target="_blank" rel="noopener noreferrer" class="ed-btn ed-btn-accent !py-2.5 !px-4">
        <svg class="w-4 h-4 fill-current shrink-0" viewBox="0 0 24 24" aria-hidden="true">
            <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"/>
          </svg>
        <span>GitHub 저장소</span>
      </a>
    </div>

  </main>

  <script src="report-render.js"></script>
  <script src="assets/coupang/report-data.js"></script>
  <script>
    if (window.lucide) window.lucide.createIcons();
    const themeBtn = document.getElementById('theme-toggle');
    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
    themeBtn?.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    renderHero('#hero', REPORT_DATA);
    renderReport(REPORT_DATA, { mount: '#report-root', startNum: 1 });
  </script>
</body>
</html>
